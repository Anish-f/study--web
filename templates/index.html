<!DOCTYPE html>
<html>
<head>
    <title>Study Tracker</title>
    <style>
        body {
            font-family: Arial;
            background-color: #1e1e2f;
            color: white;
            text-align: center;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            padding: 10px;
            border: 1px solid #444;
        }
        th {
            background-color: #6c63ff;
        }
        button {
            padding: 10px 20px;
            background-color: #6c63ff;
            color: white;
            border: none;
            cursor: pointer;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h1>📚 Study Tracker</h1>

<form method="POST">
    <input type="date" name="date" required>
    <input type="number" step="0.1" name="hours" placeholder="Hours" required>
    <button type="submit">Add Entry</button>
</form>

<br>

<table>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Hours</th>
        <th>Fee (₹)</th>
    </tr>
    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[2] * 1000 }}</td>
    </tr>
    {% endfor %}
</table>

<h2>Total Hours: {{ total_hours }}</h2>
<h2>Total Fees: ₹{{ total_fees }}</h2>

</body>
</html>
