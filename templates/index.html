<!DOCTYPE html>
<html>
<head>
    <title>Study Tracker</title>
    <style>
        body {
            font-family: Arial;
            background-color: #1e1e2f;
            color: white;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 70%;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #444;
        }

        th {
            background-color: #6c63ff;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            background-color: #6c63ff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .secondary {
            background-color: #3e3e5e;
        }

        .danger {
            background-color: #cc4444;
        }

        tr:hover {
            background-color: #2c2c3e;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>📚 Study Tracker</h1>

<!-- MAIN FORM -->
<form id="mainForm" method="POST" action="/add">
    <input type="hidden" name="id" id="recordId">

    <input type="date" name="date" id="dateField" required>
    <input type="number" step="0.1" name="hours" id="hoursField" placeholder="Hours" required>

    <button type="submit">Add</button>
    <button type="button" class="secondary" onclick="updateEntry()">Update</button>
    <button type="button" class="danger" onclick="deleteEntry()">Delete</button>
</form>



<table>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Hours</th>
        <th>Fee (₹)</th>
    </tr>

    {% for row in data %}
    <tr onclick="selectRow('{{ row['id'] }}', '{{ row['date'] }}', '{{ row['hours'] }}')">
        <td>{{ row["id"] }}</td>
        <td>{{ row["date"] }}</td>
        <td>{{ row["hours"] }}</td>
        <td>{{ row["hours"] * 1000 }}</td>
    </tr>
    {% endfor %}
</table>

<h2>Total Hours: {{ total_hours }}</h2>
<h2>Total Fees: ₹{{ total_fees }}</h2>

<script>
function selectRow(id, date, hours) {
    document.getElementById("recordId").value = id;
    document.getElementById("dateField").value = date;
    document.getElementById("hoursField").value = hours;
}

function updateEntry() {
    let form = document.getElementById("mainForm");
    form.action = "/update";
    form.submit();
}

function deleteEntry() {
    if (confirm("Delete this entry?")) {
        let form = document.getElementById("mainForm");
        form.action = "/delete";
        form.submit();
    }
}
</script>

</body>
</html>
